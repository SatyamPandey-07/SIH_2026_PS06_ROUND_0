[project]
name = "athena"
version = "0.1.0"
description = "AI-powered automated title verification system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jellyfish>=1.2.1",
    "networkx>=3.6.1",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "pymupdf>=1.28.2",
    "rapidfuzz>=3.14.5",
    "scikit-learn>=1.9.0",
    "streamlit>=1.61.1",
]

[project.scripts]
athena = "athena:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
